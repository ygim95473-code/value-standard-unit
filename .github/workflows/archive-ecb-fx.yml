name: Archive ECB FX observations
on:
  schedule:
    - cron: '25 17 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archive-ecb-fx
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and archive ECB observations
        run: python scripts/collect_ecb_fx.py
      - name: Commit only new snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/fx/ecb/
          if git diff --cached --quiet; then
            echo "No new ECB observations"
          else
            git commit -m "data: archive ECB reference FX observations"
            git push
          fi
