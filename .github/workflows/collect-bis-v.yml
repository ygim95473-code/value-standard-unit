name: Collect BIS V observations
on:
  workflow_dispatch:
  schedule:
    - cron: '40 16 * * 4'
permissions:
  contents: write
concurrency:
  group: collect-bis-v
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch observed BIS indices
        run: python scripts/collect_bis_v.py
      - name: Commit validated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/bis-v-observations.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh observed BIS V indices"
            git push
          fi
